<html>
<body>
<script> 
function display(){ 
    var x="You have clicked"; 
    var d=new Date(); 
    var date=d.getDate(); 
    var month=d.getMonth(); 
    month++;
    var year=d.getFullYear(); 
    document.getElementById("dis").value=date+"/"+month+"/"+year;
}
</script>
<form>
<inputtype="text"id="dis"/><br/>
<inputtype="button"value="DisplayDate"onclick="display()" />
</form>
