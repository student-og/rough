<!DOCTYPE html>
<html>
<head>
    <title>Register - Online Book Store</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f9f9f9; }
        .reg-container { width: 350px; margin: 40px auto; padding: 30px; background: #fff; border-radius: 8px; box-shadow: 0 0 10px #ccc; }
        h2 { text-align: center; }
        input[type="text"], input[type="password"], input[type="email"] { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; }
        input[type="submit"] { width: 100%; padding: 10px; background: #4A90E2; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        input[type="submit"]:hover { background: #357ab8; }
    </style>
    <script type='text/javascript'>
        function formValidator() {
            //Makequickreferences toour fields 
            var firstname = document.getElementById('firstname');
            var lastname = document.getElementById('lastname');
            var email = document.getElementById('email');
            var pass = document.getElementById('pass');
            var addr = document.getElementById('addr');
            var mobileno = document.getElementById('mobileno');
            //Checkeachinputintheorderthatitappearsintheform! 
            if (notEmpty(firstname, "First name cannot be null")) {
                if (isAlphabet(firstname, "Please enter only letters for your First name")) {
                    if (lengthRestriction(firstname, 6)) {
                        if (notEmpty(lastname, "Last name cannot be null")) {
                            if (isAlphabet(lastname, "Please enter only letters for your Last name")) {
                                if (emailValidator(email, "Please enter a valid email address")) {
                                    if (lengthRestriction(pass, 6)) {
                                        if (isAlphanumeric(pass, "please enter Numbers and Letters Only for password")) {
                                            if (notEmpty(addr, "please enter the address")) {
                                                if (isNumeric(mobileno, "Please enter a valid mobile no")) {
                                                    if (lengthRestriction1(mobileno, 10, 10)) {
                                                        return true;
                                                    }
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }
            return false;
        }

        function notEmpty(elem, helperMsg) {
            if (elem.value.length == 0) {
                alert(helperMsg);
                elem.focus(); //setthefocustothisinput 
                return false;
            }
            return true;
        }

        function isNumeric(elem, helperMsg) {
            var numericExpression = /^[0-9]+$/;
            if (elem.value.match(numericExpression)) {
                return true;
            } else {
                alert(helperMsg);
                elem.focus();
                return false;
            }
        }

        function isAlphabet(elem, helperMsg) {
            var alphaExp = /^[a-zA-Z]+$/;
            if (elem.value.match(alphaExp)) {
                return true;
            } else {
                alert(helperMsg);
                elem.focus();
                return false;
            }
        }

        function isAlphanumeric(elem, helperMsg) {
            var alphaExp = /^[0-9a-zA-Z]+$/;
            if (elem.value.match(alphaExp)) {
                return true;
            } else {
                alert(helperMsg);
                elem.focus();
                return false;
            }
        }

        function lengthRestriction(elem, min) {
            var uInput = elem.value;
            if (uInput.length >= min) {
                return true;
            } else {
                alert("Please enter minimum " + min + " characters");
                elem.focus();
                return false;
            }
        }

        function emailValidator(elem, helperMsg) {
            var emailExp = /^[\w\-\.\+]+\@[a-zA-Z0-9\.\-]+\.[a-zA-z0-9]{2,4}$/;
            if (elem.value.match(emailExp)) {
                return true;
            } else {
                alert(helperMsg);
                elem.focus();
                return false;
            }
        }

        function lengthRestriction1(elem, min, max) {
            var uInput = elem.value;
            if (uInput.length >= min && uInput.length <= max) {
                return true;
            } else {
                alert("Please enter 10 numbers only");
                elem.focus();
                return false;
            }
        }
    </script>
</head>
<body>
    <div class="reg-container">
        <h2>Register</h2>
        <form onsubmit='return formValidator()' action="right.html">
            <label for="firstname">First Name (Minimum 6 characters):</label>
            <input type='text' id='firstname' name="firstname" required>
            <label for="lastname">Last Name:</label>
            <input type='text' id='lastname' name="lastname" required>
            <label for="email">Email Address:</label>
            <input type='email' id='email' name="email" required>
            <small>(one e-mail id only, e.g. smith@hotmail.com)</small>
            <label for="pass">Password (minimum 6 characters):</label>
            <input type='password' id='pass' name="password" required>
            <label for="addr">Address:</label>
            <textarea rows="2" cols="20" id='addr' name="address" required></textarea>
            <label for="mobileno">Mobile No:</label>
            <input type='text' id='mobileno' name="mobileno" required>
            <fieldset>
                <legend>Gender:</legend>
                <input type='radio' name="gender" value="male" required> Male
                <input type='radio' name="gender" value="female"> Female
            </fieldset>
            <input type='submit' value='Register'>
            <input type='reset' value='Reset'>
        </form>
    </div>
</body>
</html>
