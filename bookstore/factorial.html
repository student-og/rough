<html>
<head>
<title>factorial</title>
<scriptlanguage='javascript'>



functionfactorialcalc()
{
number=parseInt(prompt("enteranumber,i'llcalculateitsfactorial","whole numbers bigger than zero, please"))
factorial=1; 
for(i=1;i<=number;i++)
{
factorial=factorial*i
}
alert("thefactorialof "+ number+"is"+factorial)
}
</script>
</head>
<body><formname=frm>
<inputtype=buttonvalue='factorial'onclick="factorialcalc();">
</form>
</body>
</html>
