<!DOCTYPE html>

<head>

        th, td { border: 1px solid #ccc; padding: 12px; text-align: left; }
        th { background: #4A90E2; color: #fff; }
        tr:nth-child(even) { background: #f2f2f2; }
        h2 { text-align: center; }

</head>
